<html>
    <head>
        <meta charset="UTF-8">
        <title>Menu lateral</title>
                <!-- importando css externo -->
        <link rel="stylesheet" href="estilo.css">
        <style>
        /* Usando CSS interno para formatar o corpo e os links */
            body {
                font-family: arial;
                background-color: #c9edff; /* Um fundo bem clarinho para o menu */
            }

            p {
                margin-top: 1px;    /* Espaço em cima do link */
                margin-bottom: 1px; /* Espaço maior embaixo do link */
                margin-left: 10px;
            }

            /* Estilização de links exatamente como ensinado na Aula 5 */
            a:link { 
                color: #b0c9e2; 
                text-decoration: none; 
            }
            a:visited { 
                color: #0a5eb8; 
                text-decoration: none; 
            }
            a:active { 
                color: #cbdbe4; 
                font-weight: bold; 
            }
            a:link:hover { 
                background-color: #d4d4d4; 
                color: #ffffff; 
                text-decoration: none; 
            }

            form {
                margin-left: 10px;
                font-size: 16px; /* Aumentei um pouco a fonte do formulário também */
            }

        </style>
    </head>

        <p><a href="home.html" target="conteudo"><b>Home</b></a></p><br>
        <p><a href="sobreEmpresa.html" target="conteudo"><b>Sobre a empresa</b></a></p><br>

        <br>

        <!-- Formulário de Login -->
        <p color=""><b>Formulário de Login</b></p>

            Usuário:<br>
            <input type="text" name="usuario" size="10" maxlength="10"><br><br>

        </form>

    </body>
</html>
