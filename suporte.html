<html>
    <head>
        <meta charset="UTF-8">
        <title>Suporte - Vida Animal</title>

        <!-- CSS externo -->
        <link rel="stylesheet" href="estilo.css">
    </head>
    <body>
        <form method="POST">
            <table width="100%">
                <tr>
                    <th colspan="2">Central de Suporte</th>
                </tr>

                <tr>
                    <td colspan="2" align="center" style="padding-top: 15px; padding-bottom: 15px;">
                        <p style="font-size: 13pt;">Ficou com alguma dúvida sobre os nossos serviços, agendamentos ou precisa de ajuda com o seu cadastro?</p>
                        <p>Preencha o formulário abaixo ou escreva para <b>suporte@vidaanimal.com.br</b></p>
                    </td>
                </tr>

                <tr>
                    <td width="25%" align="right"><b>Nome:</b></td>
                    <td><input type="text" name="nome" size="40" maxlength="80"></td>
                </tr>

                <tr>
                    <td align="right"><b>Assunto:</b></td>
                    <td>
                        <select name="assunto">
                            <option value="">Selecione</option>
                            <option value="servicos">Dúvida sobre serviços</option>
                            <option value="agendamento">Agendamento</option>
                            <option value="cadastro">Problema no cadastro</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td align="right"><b>Responder por:</b></td>
                    <td>
                        <input type="radio" name="contato" value="email" checked> E-mail
                        <input type="radio" name="contato" value="celular"> Celular
                    </td>
                </tr>

                <tr>
                    <td align="right"><b>E-mail ou celular:</b></td>
                    <td><input type="text" name="contatopadrao" size="40" maxlength="60"></td>
                </tr>

                <tr>
                    <td align="right" style="vertical-align: top;"><b>Mensagem:</b></td>
                    <td><textarea name="mensagem" rows="5" cols="50"></textarea></td>
                </tr>

                <tr>
                    <td colspan="2" align="center" style="padding-top: 15px; padding-bottom: 15px;">
                        <input type="submit" value="Enviar" style="background-color: #59bcf5; color: #FFFFFF; font-weight: bold; border-color: #0a5eb8; padding-left: 25px; padding-right: 25px;">
                        <input type="reset" value="Limpar" style="padding-left: 25px; padding-right: 25px;">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
