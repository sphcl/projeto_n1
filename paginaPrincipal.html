<html>
    <head>
        <meta charset="UTF-8">
        <title>Site Clinica Veterinária</title>
        <!-- importando css externo -->
        <link rel="stylesheet" href="estilo.css">
    </head>
    <body> 
    <!-- Corpo da página dividido em 3 iframes, header, menu lateral e conteúdo -->
    <!-- header da página -->
        <iframe src="cabecalho.html" frameborder="0" width="100%" height="100" scrolling="no" align="left" name="cabecalho">
        </iframe>

    <!-- tabela para dividir o restante da página em duas colunas -->
        <table border="0" width="100%">
            <tr>
                <!-- coluna 1 - Menu lateral da página -->
                <td width="200">
                    <iframe src="menuLateral.html" frameborder="0" width="100%" height="500" scrolling="no" name="name">
                    </iframe>
                </td>

                <!-- coluna 2 - espaço para o conteúdo da página -->
                <td>
                    <iframe src="home.html" frameborder="0" width="100%" height="500" scrolling="yes" name="conteudo">
                    </iframe>
                </td>
            </tr>
        </table>
    </body>
</html>
